services:
  - type: web
    name: cropvision-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements-production.txt && test -f model/crop_disease_model.keras && test -f model/class_names.json && test -f artifacts/rejection_calibration.json
    startCommand: gunicorn --workers 1 --timeout 120 'run:app'
    envVars:
      - key: CORS_ORIGINS
        sync: false
